<!DOCTYPE html>
<html>
<head>
    <title>训练计划功能测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        button { margin: 5px; padding: 10px; }
        pre { background: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>训练计划功能测试</h1>
    
    <div class="test">
        <h3>测试1: 创建训练计划</h3>
        <button onclick="testCreatePlan()">测试创建计划</button>
        <div id="result1"></div>
    </div>
    
    <div class="test">
        <h3>测试2: 获取训练计划列表</h3>
        <button onclick="testGetPlans()">获取计划列表</button>
        <div id="result2"></div>
    </div>
    
    <div class="test">
        <h3>测试3: 完整流程测试</h3>
        <button onclick="testFullFlow()">运行完整测试</button>
        <div id="result3"></div>
    </div>
    
    <div id="log"></div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
        }
        
        async function testCreatePlan() {
            const plan = {
                title: '测试训练计划',
                content: '这是一个测试训练计划\n包含多个训练项目',
                goal: '增肌',
                start_date: '2024-01-01',
                end_date: '2024-12-31',
                created_from_ai: true
            };
            
            try {
                const response = await fetch(`${API_BASE}/api/training/plans`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(plan)
                });
                
                const data = await response.json();
                document.getElementById('result1').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                log('创建计划成功');
                return data.plan.id;
            } catch (error) {
                log(`创建失败: ${error}`);
                return null;
            }
        }
        
        async function testGetPlans() {
            try {
                const response = await fetch(`${API_BASE}/api/training/plans`);
                const data = await response.json();
                document.getElementById('result2').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                log(`获取到 ${data.plans?.length || 0} 个计划`);
            } catch (error) {
                log(`获取计划失败: ${error}`);
            }
        }
        
        async function testFullFlow() {
            log('开始完整测试...');
            
            // 1. 创建计划
            log('1. 创建训练计划...');
            const planId = await testCreatePlan();
            if (!planId) {
                log('创建计划失败');
                return;
            }
            
            // 2. 获取计划列表
            log('2. 获取计划列表...');
            await testGetPlans();
            
            log('测试完成！');
        }
        
        // 绑定按钮事件
        document.querySelector('button[onclick="testCreatePlan()"]').onclick = testCreatePlan;
        document.querySelector('button[onclick="testGetPlans()"]').onclick = testGetPlans;
        document.querySelector('button[onclick="testFullFlow()"]').onclick = testFullFlow;
    </script>
</body>
</html>
